<!doctype html>
<html lang="{{ language }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ texts.dashboard.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #12010d; --panel: #1d0214; --panel-2: #2a0920; --line: #3e042b; --line-strong: #5a1544;
  --ink: #fdfcf6; --muted: #c29aae; --faint: #7d5a7d;
  --accent: #e520e9; --accent-ink: #f637fe; --accent-soft: rgba(229, 32, 233, .14); --aqua: #77ffd8;
  --warn: #d39b22; --err: #f85249; --info: #3083f8; --violet: #a373f7;
  --mono: "Roboto Mono", "FT System Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: Inter, "ABC Diatype", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #fdfcf6; --panel: #f4f2e8; --panel-2: #ebe7dc; --line: #dfdad1; --line-strong: #c6c0b6;
    --ink: #191711; --muted: #716d64; --faint: #a39d92; --accent: #bc0fbc; --accent-ink: #9a0e98;
    --accent-soft: rgba(188, 15, 188, .1); --aqua: #007a55; color-scheme: light;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }

header {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 24px;
  padding: 0 20px; height: 52px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.brand i { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.brand span { color: var(--muted); font-weight: 400; }
nav { display: flex; gap: 2px; height: 100%; overflow-x: auto; }
nav button {
  border: 0; background: none; padding: 0 12px; height: 100%; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; white-space: nowrap;
}
nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.spacer { flex: 1; }
.live { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 999px;
  padding: 3px 10px; background: none; cursor: pointer; white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.live[aria-pressed="true"] i { background: var(--aqua); animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(119, 255, 216, .6); } 100% { box-shadow: 0 0 0 7px rgba(119, 255, 216, 0); } }

main { padding: 20px; max-width: 1600px; margin: 0 auto; }
h2 { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
.grid { display: grid; gap: 12px; }
.kpis { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); margin-bottom: 16px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.kpi b { display: block; font: 500 22px/1.2 var(--mono); letter-spacing: -.02em; }
.kpi small { color: var(--muted); font-size: 12px; }
.panels { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin-bottom: 16px; }
.wide { grid-column: 1 / -1; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
  padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scroll { overflow-x: auto; }
tr.mono td, .heat td { white-space: nowrap; }
.kv td:first-child { color: var(--muted); width: 45%; }
.rows tr { cursor: pointer; }
.rows tr:hover td { background: var(--accent-soft); }
.rows tr.selected td { background: var(--accent-soft); }
.rows td:first-child { border-left: 3px solid var(--bar, transparent); }
.topic { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.filters input, .filters select, .token input {
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 10px; min-width: 0;
}
.filters input:focus, .filters select:focus, .token input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
.btn { border: 1px solid var(--line-strong); background: var(--panel-2); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

.chip { display: inline-block; padding: 1px 7px; border-radius: 999px; font: 500 11.5px/1.6 var(--mono);
  background: color-mix(in srgb, var(--c, var(--faint)) 18%, transparent); color: var(--c, var(--muted));
  border: 1px solid color-mix(in srgb, var(--c, var(--faint)) 40%, transparent); white-space: nowrap; }
.chip.clicked { background: var(--c, var(--accent)); color: #12010d; }

.drawer { position: fixed; top: 52px; right: 0; bottom: 0; width: min(620px, 100%); background: var(--panel);
  border-left: 1px solid var(--line-strong); overflow-y: auto; transform: translateX(100%); transition: transform .18s ease, visibility .18s;
  z-index: 4; padding: 18px; visibility: hidden; }
.drawer.open { transform: none; visibility: visible; box-shadow: -20px 0 40px rgba(0, 0, 0, .35); }
.drawer section { margin-bottom: 20px; }
.drawer header { position: static; height: auto; padding: 0 0 14px; border: 0; background: none; align-items: flex-start; gap: 12px; }
.close { margin-left: auto; }

.wf { display: grid; grid-template-columns: 90px 1fr 70px; gap: 6px 10px; align-items: center; font: 12px var(--mono); }
.wf .track { position: relative; height: 14px; background: var(--panel-2); border-radius: 3px; }
.wf .bar { position: absolute; top: 0; bottom: 0; border-radius: 3px; min-width: 3px; }
.prob { display: grid; grid-template-columns: 110px 1fr 46px; gap: 4px 10px; align-items: center; font: 12px var(--mono); }
.prob .track { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.prob .fill { height: 100%; border-radius: 4px; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto;
  font: 12px/1.5 var(--mono); margin: 0; }
.heat td { text-align: center; font: 11.5px var(--mono); padding: 4px; }
.gold { display: flex; flex-wrap: wrap; gap: 6px; }
.gold button { cursor: pointer; }
.ratio { position: relative; height: 16px; background: var(--panel-2); border-radius: 3px; min-width: 160px; }
.ratio .band { position: absolute; top: 3px; bottom: 3px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 3px; }
.ratio .dot { position: absolute; top: 2px; width: 2px; bottom: 2px; background: var(--accent-ink); }

.token { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 10; padding: 16px; }
.token form { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; width: min(380px, 100%);
  display: grid; gap: 12px; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.error { color: var(--err); }
@media (max-width: 720px) {
  header { gap: 12px; padding: 0 12px; }
  .brand span, .live small, #updated { display: none; }
  main { padding: 16px; }
}
.lead { margin: -4px 0 12px; color: var(--muted); font-size: 12.5px; max-width: 70ch; }
.sym { margin-left: 5px; font: 11px var(--mono); color: var(--faint); text-transform: none; letter-spacing: 0; }
.tip { display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 5px; border-radius: 50%;
  border: 1px solid var(--line-strong); color: var(--muted); font: 600 10px/1 var(--sans); cursor: help;
  vertical-align: 1px; text-transform: none; letter-spacing: 0; }
.tip:hover, .tip:focus { border-color: var(--accent); color: var(--accent-ink); outline: none; }
#tipbox { position: fixed; z-index: 20; max-width: min(300px, calc(100vw - 32px)); padding: 8px 10px; background: var(--panel-2);
  border: 1px solid var(--line-strong); border-radius: 6px; font-size: 12.5px; line-height: 1.45; pointer-events: none;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35); }
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>claire <span>/ admin</span></div>
  <nav id="tabs">
    {% for view, name in texts.dashboard.tabs.items() %}
    <button data-view="{{ view }}"{% if loop.first %} aria-current="page"{% endif %}>{{ name }}</button>
    {% endfor %}
  </nav>
  <div class="spacer"></div>
  <span id="updated" class="mono faint"></span>
  <button id="live" class="live mono" aria-pressed="true"><i></i><small>{{ texts.dashboard.ui.live }}</small></button>
</header>
<main id="view"></main>
<aside id="drawer" class="drawer" aria-hidden="true"></aside>
<div id="tipbox" role="tooltip" hidden></div>
<div id="token" class="token" hidden>
  <form>
    <div class="brand"><i></i>claire <span>/ admin</span></div>
    <label class="muted" for="token-input">{{ texts.dashboard.ui.token }}</label>
    <input id="token-input" type="password" autocomplete="current-password" required>
    <button class="btn primary">{{ texts.dashboard.ui.open }}</button>
    <p id="token-error" class="error" hidden>{{ texts.dashboard.ui.invalid }}</p>
  </form>
</div>
<script>
const TEXTS = {{ texts | tojson }};
const D = TEXTS.dashboard;
const LANG = document.documentElement.lang;
const OUTCOME_COLORS = {
  moved_on: "var(--aqua)", too_long: "var(--accent-ink)", too_short: "var(--info)", missing_info: "var(--warn)",
  misunderstood: "var(--err)", wrong_format: "var(--violet)", no_signal: "var(--faint)",
};
const READING_COLORS = { read: "var(--aqua)", skim: "var(--warn)", away: "var(--faint)" };
const OUTCOMES = Object.keys(OUTCOME_COLORS).filter((o) => o !== "no_signal");
const state = { view: "live", filters: {}, selected: null, live: true, timer: null };
const $ = (sel) => document.querySelector(sel);

let token = "";
try { token = sessionStorage.getItem("claire-admin-token") || ""; } catch {}

/* ---------- Texts and numbers ---------- */

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fill = (text, vars = {}) => String(text).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
const ui = (key, vars) => fill(D.ui[key] ?? key, vars);
const named = (group, key) => D[group]?.[key] ?? key;
const tip = (help) => (help ? `<span class="tip" tabindex="0" data-tip="${esc(help)}" aria-label="${esc(ui("help"))}">?</span>` : "");
// A term's plain name, its notation for ML readers, and its explanation on demand.
function term(key, vars) {
  const t = D.terms[key] || { name: key };
  return `${esc(fill(t.name, vars))}${t.symbol ? `<span class="sym">${esc(t.symbol)}</span>` : ""}${tip(t.help && fill(t.help, vars))}`;
}
// A panel title, with its explanation written out below it.
function head(key, vars, extra = "") {
  const t = D.terms[key] || { name: key };
  return `<h2>${esc(fill(t.name, vars))}${t.symbol ? `<span class="sym">${esc(t.symbol)}</span>` : ""} ${extra}</h2>${t.help ? `<p class="lead">${esc(fill(t.help, vars))}</p>` : ""}`;
}

const missing = (v) => v === null || v === undefined || Number.isNaN(v);
const num = (v, d = 0) => (missing(v) ? "—" : Number(v).toLocaleString(LANG, { minimumFractionDigits: d, maximumFractionDigits: d }));
const pct = (v) => (missing(v) ? "—" : Number(v).toLocaleString(LANG, { style: "percent" }));
const times = (v) => (missing(v) ? "—" : `×${num(v, 2)}`);
const factor = (logSd) => (missing(logSd) ? "—" : times(Math.exp(logSd)));  // A spread on the log scale.
const plusMinus = (logSd) => (missing(logSd) ? "—" : `±${pct(Math.exp(logSd) - 1)}`);
const ratio = (a, b) => (b ? a / b : null);
const time = (iso) => (iso ? new Date(iso).toLocaleTimeString(LANG, { hour12: false }) : "—");
const datetime = (iso) => (iso ? new Date(iso).toLocaleString(LANG, { hour12: false }) : "—");
const secs = (v) => (missing(v) ? "—" : v < 60 ? `${num(v, 1)} s` : v < 3600 ? `${num(v / 60, 1)} min` : `${num(v / 3600, 1)} h`);
const words = (v) => ui("words", { n: num(v) });

const chip = (label, color, extra = "") => `<span class="chip ${extra}" style="--c:${color}">${esc(label)}</span>`;
const outcomeChip = (o, extra) => (o ? chip(named("outcomes", o), OUTCOME_COLORS[o] || "var(--faint)", extra) : '<span class="faint">—</span>');
const buttonName = (b) => TEXTS.buttons[b]?.label ?? b;
const kv = (rows) => `<table class="kv">${rows.map(([k, v]) => `<tr><td>${k}</td><td class="mono">${v}</td></tr>`).join("")}</table>`;
const table = (columns, body) => `<table><tr>${columns.map((c) => `<th>${term(c)}</th>`).join("")}</tr>${body}</table>`;
const empty = (key, columns = 1) => `<tr><td colspan="${columns}" class="faint">${esc(ui(key))}</td></tr>`;

// A scope: "*" (in general), "topic:<id>" (a topic domain) or "mobile" (on a phone).
function scopeName(scope) {
  if (scope === "*" || scope === "topic:any") return ui("general");
  if (scope === "mobile") return `${ui("general")} · ${ui("mobile")}`;
  return scope.startsWith("topic:") ? ui("domain", { n: scope.slice(6) }) : scope;
}

function preference(dimension, value) {
  const [kind, arm] = dimension.split(":");
  if (kind === "button") return [ui("button_pref", { name: buttonName(arm) }), ui(value)];
  if (kind === "clarify") return [`${ui("clarify_pref")} · ${named("clarify", arm)}`, ui(value)];
  if (dimension === "length") return [TEXTS.dimensions.length?.name ?? dimension, TEXTS.lengths[value] ?? value];
  const d = TEXTS.dimensions[dimension];
  return [d?.name ?? dimension, d?.values[value] ?? value];
}

/* ---------- Plumbing ---------- */

async function api(path, options = {}) {
  const response = await fetch(path, { ...options, headers: { ...(options.headers || {}), authorization: `Bearer ${token}` } });
  if (response.status === 401) {
    askToken(Boolean(token));
    throw new Error("unauthorized");
  }
  if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
  return response.json();
}

function askToken(failed) {
  $("#token").hidden = false;
  $("#token-error").hidden = !failed;
  $("#token-input").focus();
}

$("#token form").addEventListener("submit", (event) => {
  event.preventDefault();
  token = $("#token-input").value.trim();
  try { sessionStorage.setItem("claire-admin-token", token); } catch {}
  $("#token").hidden = true;
  render();
});

// One floating tooltip, so that scrolling panels never clip it.
function showTip(event) {
  const target = event.target.closest?.(".tip");
  const box = $("#tipbox");
  if (!target) return void (box.hidden = true);
  box.textContent = target.dataset.tip;
  box.hidden = false;
  const r = target.getBoundingClientRect();
  const left = Math.min(Math.max(16, r.left + r.width / 2 - box.offsetWidth / 2), innerWidth - box.offsetWidth - 16);
  const below = r.bottom + 6 + box.offsetHeight < innerHeight;
  box.style.left = `${left}px`;
  box.style.top = `${below ? r.bottom + 6 : r.top - 6 - box.offsetHeight}px`;
}
for (const type of ["mouseover", "focusin"]) document.addEventListener(type, showTip);
document.addEventListener("scroll", () => { $("#tipbox").hidden = true; }, true);

function probBars(probs, colors = OUTCOME_COLORS, group = "outcomes") {
  if (!probs) return `<p class="faint">${esc(ui("not_finalized"))}</p>`;
  return `<div class="prob">${Object.entries(probs).filter(([k]) => k !== "seconds").map(([k, v]) =>
    `<span>${esc(named(group, k))}</span><div class="track"><div class="fill" style="width:${100 * v}%;background:${colors[k] || "var(--accent)"}"></div></div><span>${pct(v)}</span>`).join("")}</div>`;
}
const caption = (key) => `<p class="lead" style="margin:12px 0 6px">${esc(ui(key))}</p>`;

/* ---------- Live ---------- */

async function renderLive() {
  const [overview, turns] = await Promise.all([api("/admin/api/overview"), api(`/admin/api/turns?${new URLSearchParams(state.filters)}`)]);
  const c = overview.counts;
  const kpis = [
    [c.turns, "turns", ui("in_24h", { n: c.turns_24h })],
    [c.conversations, "conversations", c.held_back_conversations ? ui("in_arms", { p: pct(ratio(c.held_back_conversations, c.conversations)) }) : ""],
    [c.users, "users", ""],
    [pct(ratio(c.widget_turns, c.turns)), "widget_mode", ui("turns_n", { n: c.widget_turns })],
    [pct(ratio(c.widget_turns_with_reply, c.widget_turns)), "show_reply_coverage", ui("of_widget")],
    [pct(ratio(c.turns_with_click, c.turns_with_buttons)), "click_rate", ui("clicks_of", { a: c.turns_with_click, b: c.turns_with_buttons })],
    [c.finalized_turns, "finalized", ui("gold_n", { n: c.gold_labels })],
    [c.last_nightly ? time(c.last_nightly) : ui("never"), "last_nightly", c.last_nightly ? new Date(c.last_nightly).toLocaleDateString(LANG) : ""],
  ];
  const settings = overview.settings;
  $("#view").innerHTML = `
    <div class="grid kpis">${kpis.map(([v, key, sub]) => `<div class="kpi"><small>${term(key)}</small><b>${esc(v)}</b><small class="faint">${esc(sub)}</small></div>`).join("")}</div>
    <div class="grid panels">
      <div class="panel">${head("hosts")}<div class="scroll">${table(["hosts", "protocol", "apps", "conversations", "last"],
        overview.hosts.map((h) => `<tr class="mono"><td>${esc(h.host)}</td><td>${esc(h.protocol_version || "—")}</td><td>${h.ui_supported ? chip(ui("yes"), "var(--aqua)") : chip(ui("no"), "var(--err)")}</td><td>${h.conversations}</td><td>${time(h.last_seen)}</td></tr>`).join(""))}</div></div>
      <div class="panel">${head("topic_domains", {}, `· ${c.topic_clusters}`)}${overview.topic_clusters.length
        ? kv(overview.topic_clusters.map((k) => [`${esc(ui("domain", { n: k.id }))} · ${k.size}`, `“${esc(k.medoid_topic)}”`]))
        : `<p class="faint">${esc(ui("domains_until"))}</p>`}</div>
      <div class="panel scroll">${head("questions")}${overview.questions.length ? table(["question", "language", "asked_by", "follows"],
        overview.questions.map((q) => `<tr><td>${esc(q.text)}${q.users < overview.min_users ? "" : ` ${chip("✓", "var(--aqua)")}`}</td><td class="mono">${esc(q.language)}</td><td class="mono">${q.users}</td><td class="mono">${q.follows}</td></tr>`).join(""))
        : `<p class="faint">${esc(ui("questions_until"))}</p>`}</div>
      <div class="panel">${head("tool_calls")}${kv(overview.tool_calls.map((t) => [esc(t.tool), t.calls_24h]))}</div>
      <div class="panel">${head("settings")}${kv([
        [term("policy"), esc(settings.policy)],
        [term("q"), num(settings.q, 2)],
        [term("arm_shares"), Object.entries(settings.arm_shares).map(([arm, share]) => `${esc(named("groups", arm))} ${pct(share)}`).join(" · ")],
        [term("control_unit"), esc(settings.control_unit)],
        [term("shadow_policies"), esc(settings.shadow_policies.join(", ") || "—")],
        [term("cache_ttl_ms"), num(settings.cache_ttl_ms)],
      ])}</div>
    </div>
    ${head("turns_table")}
    <form class="filters" id="filters">
      <input name="q" placeholder="${esc(ui("topic_contains"))}" value="${esc(state.filters.q)}">
      <input name="user" placeholder="${esc(ui("user_id"))}" size="8" value="${esc(state.filters.user)}">
      <input name="conversation" placeholder="${esc(ui("conversation_id"))}" size="12" value="${esc(state.filters.conversation)}">
      <input name="host" placeholder="${esc(ui("host"))}" size="14" value="${esc(state.filters.host)}">
      <select name="mode"><option value="">${esc(ui("any_mode"))}</option>${Object.entries(D.modes).map(([m, name]) => `<option value="${m}" ${state.filters.mode === m ? "selected" : ""}>${esc(name)}</option>`).join("")}</select>
      <select name="group"><option value="">${esc(ui("any_group"))}</option>${Object.entries(D.groups).map(([g, name]) => `<option value="${g}" ${state.filters.group === g ? "selected" : ""}>${esc(name)}</option>`).join("")}</select>
      <button class="btn">${esc(ui("filter"))}</button><button class="btn" type="reset">${esc(ui("clear"))}</button>
    </form>
    <div class="panel scroll" style="padding:0">${turns.length ? `<table class="rows">
      <tr>${["time", "turn", "user_conv", "hosts", "mode", "topic", "words", "verdict", "inferred", "buttons", "write"].map((k) => `<th>${term(k)}</th>`).join("")}</tr>
      ${turns.map(turnRow).join("")}</table>` : `<div class="empty">${esc(ui("no_turns"))}</div>`}</div>`;
  const form = $("#filters");
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    state.filters = Object.fromEntries([...new FormData(form)].filter(([, v]) => v));
    render();
  });
  form.addEventListener("reset", () => { state.filters = {}; setTimeout(render); });
  for (const row of document.querySelectorAll(".rows tr[data-id]")) row.addEventListener("click", () => openTurn(Number(row.dataset.id)));
}

function turnRow(t) {
  const buttons = t.buttons.map((b) => chip(b.label || buttonName(b.id), b.label ? "var(--violet)" : "var(--accent)", b.position === t.clicked ? "clicked" : "")).join(" ");
  const flow = [t.needed_words, t.target_words, t.requested_words, t.reply_words_exact].map((w) => w ?? "—").join(" → ");
  return `<tr data-id="${t.id}" class="${state.selected === t.id ? "selected" : ""}" style="--bar:${OUTCOME_COLORS[t.inferred] || "transparent"}">
    <td class="mono muted">${time(t.created_at)}</td>
    <td class="mono">t_${t.id}<span class="faint"> #${t.turn_index}</span></td>
    <td class="mono">u${t.user_id} · c_${t.conversation_id}</td>
    <td class="mono">${esc(t.host)}</td>
    <td>${chip(named("modes", t.reply_mode), t.reply_mode === "widget" ? "var(--aqua)" : "var(--warn)")} ${t.grp !== "treatment" ? chip(named("groups", t.grp), "var(--faint)") : ""}</td>
    <td class="topic" title="${esc(t.topic)}">${esc(t.topic)} <span class="faint mono">${esc(t.language)}</span></td>
    <td class="mono">${flow}</td>
    <td>${outcomeChip(t.verdict)}${t.user_quote ? `<div class="faint">“${esc(t.user_quote)}”</div>` : ""}</td>
    <td>${outcomeChip(t.inferred)} <span class="mono faint">${t.inferred_p ? pct(t.inferred_p) : ""}</span></td>
    <td>${buttons || '<span class="faint">—</span>'}</td>
    <td class="mono">${secs(t.writing_seconds)}</td></tr>`;
}

/* ---------- Turn drawer ---------- */

async function openTurn(id) {
  state.selected = id;
  for (const row of document.querySelectorAll(".rows tr[data-id]")) row.classList.toggle("selected", Number(row.dataset.id) === id);
  const d = await api(`/admin/api/turns/${id}`);
  const t = d.turn;
  const start = new Date(t.created_at).getTime();
  const at = (iso) => (iso ? (new Date(iso).getTime() - start) / 1000 : null);
  const reply = d.replies[0];
  const click = d.clicks.at(-1);  // The last click is the reaction.
  const end = at(d.next_turn?.created_at) ?? Math.max(at(reply?.created_at) ?? 0, at(click?.created_at) ?? 0, 1);
  const span = Math.max(end, 0.001);
  const bar = (key, from, to, color) => from === null || to === null ? "" :
    `<span>${esc(named("timeline", key))}</span><div class="track"><div class="bar" style="left:${100 * from / span}%;width:${Math.max(100 * (to - from) / span, 0.4)}%;background:${color}"></div></div><span>${secs(to - from)}</span>`;
  const inf = d.inference;
  const cs = d.conversation_state;
  const verdict = d.outcomes.find((o) => o.source === "assistant");
  const style = t.style && !Array.isArray(t.style) ? t.style : {};
  const form = Object.entries(style.form || {}).filter(([, v]) => v !== "auto");
  const gold = d.gold_labels.at(-1);
  const drawer = $("#drawer");
  drawer.innerHTML = `
    <header>
      <div><div class="mono muted">t_${t.id} · #${t.turn_index} · c_${t.conversation_id} · u${t.user_id}</div>
      <div style="font-size:16px;font-weight:600;margin-top:4px">${esc(t.topic)}</div></div>
      <button class="btn close" id="close">${esc(ui("close"))}</button>
    </header>
    <section>${head("timeline")}<div class="wf">
      ${bar("plan_reply", 0, 0.001 * span, "var(--accent)")}
      ${bar("writing", 0, at(reply?.created_at), "var(--violet)")}
      ${click ? bar("click", at(click.created_at), at(click.created_at) + 0.004 * span, "var(--aqua)") : ""}
      ${bar("reading", at(reply?.created_at) ?? 0, at(d.next_turn?.created_at), "var(--info)")}
    </div>${d.next_turn ? "" : `<p class="faint">${esc(ui("open_turn"))}</p>`}</section>
    <section>${head("decision")}${kv([
      [term("words"), `${t.needed_words} → ${t.target_words ?? "—"} → ${t.requested_words ?? "—"} → ${reply?.reply_words_exact ?? "—"}`],
      [term("policy"), esc(t.model_version)],
      [term("theta_sample"), t.theta_sample === null ? "—" : esc(ui("of_complete", { p: pct(Math.exp(t.theta_sample)) }))],
      [term("post_mean"), t.post_mean === null ? "—" : `${esc(ui("of_complete", { p: pct(Math.exp(t.post_mean)) }))} <span class="faint">${factor(t.post_sd)}</span>`],
      [term("b_sample"), factor(t.b_sample)],
      [term("propensity"), pct(t.propensity)],
      [term("form"), form.map(([k, v]) => chip(preference(k, v).join(" : "), "var(--violet)")).join(" ") || "auto"],
      [term("clarify"), style.clarify ? esc(named("clarify", style.clarify)) : "—"],
      [term("cell"), `${esc(scopeName(style.domain || "*"))}${style.mobile ? ` · ${esc(ui("mobile"))}` : ""}`],
      [term("language"), esc(t.language)],
      ...d.shadow_decisions.map((s) => [term("shadow", { name: s.model_version }), `${words(s.target_words)} <span class="faint">(${pct(s.propensity)})</span>`]),
    ])}</section>
    <section>${head("reaction")}${kv([
      [term("assistant_verdict"), `${outcomeChip(verdict?.observed)} ${verdict?.format_issue ? chip(named("format_issues", verdict.format_issue), "var(--violet)") : ""} ${verdict?.user_quote ? `“${esc(verdict.user_quote)}”` : ""}${click ? ` <span class="faint">${esc(ui("ignored_clicked"))}</span>` : ""}`],
      [term("buttons_shown"), d.buttons_shown.map((b) => chip(`${b.position + 1} · ${b.label || buttonName(b.button)}`, b.label ? "var(--violet)" : "var(--accent)", d.clicks.some((c) => c.position === b.position) ? "clicked" : "")).join(" ") || "—"],
      [term("gold_label"), gold ? outcomeChip(gold.outcome) : "—"],
    ])}${inf ? caption("reaction_shares") : ""}${probBars(inf?.reaction_probs)}</section>
    <section>${head("gold")}<div class="gold">${OUTCOMES.map((o) => `<button class="chip" style="--c:${OUTCOME_COLORS[o]}" data-gold="${o}">${esc(named("outcomes", o))}</button>`).join("")}</div></section>
    <section>${head("length_reading")}${kv([
      [term("fused_length"), inf ? `${words(Math.exp(inf.length_mean))} <span class="faint">${plusMinus(Math.sqrt(inf.length_var))}</span>` : "—"],
      [term("reading_time"), inf ? secs(inf.reading_probs.seconds) : "—"],
    ])}${inf ? caption("reading_shares") + probBars(inf.reading_probs, READING_COLORS, "reading") : ""}</section>
    <section>${head("conversation")}${kv([
      [term("host_protocol"), `${esc(d.conversation.host)} · ${esc(d.conversation.protocol_version || "—")}`],
      [term("group_apps"), `${esc(named("groups", d.conversation.grp))} · ${esc(ui(d.conversation.ui_supported ? "yes" : "no"))}`],
      [term("platform_locale"), esc(d.contexts.map((x) => `${x.platform || "?"} · ${x.locale || "?"}`).join(", ") || "—")],
      [term("compliance"), cs ? `${pct(Math.exp(cs.kappa_mean))} <span class="faint">${factor(Math.sqrt(cs.kappa_var))}</span>` : "—"],
      [term("writing_speed"), cs ? esc(ui("wps", { n: num(Math.exp(cs.speed_mean)) })) : "—"],
    ])}${cs ? caption("class_shares") + probBars(cs.family_probs, {}) : ""}
      <p><a href="#" id="filter-conv">${esc(ui("show_conversation"))}</a> · <a href="#" id="filter-user">${esc(ui("show_user"))}</a></p></section>
    <section>${head("raw")}<pre>${esc(JSON.stringify(t.raw_payload, null, 2))}</pre></section>`;
  drawer.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  $("#close").onclick = closeTurn;
  $("#filter-conv").onclick = (e) => { e.preventDefault(); state.filters = { conversation: t.conversation_id }; closeTurn(); setView("live"); };
  $("#filter-user").onclick = (e) => { e.preventDefault(); state.filters = { user: t.user_id }; closeTurn(); setView("live"); };
  for (const b of drawer.querySelectorAll("[data-gold]")) b.onclick = async () => {
    await api("/gold_label", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ turn_id: `t_${t.id}`, outcome: b.dataset.gold }) });
    openTurn(id);
  };
}

function closeTurn() {
  state.selected = null;
  $("#drawer").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden", "true");
  for (const row of document.querySelectorAll(".rows tr.selected")) row.classList.remove("selected");
}

/* ---------- Users ---------- */

async function renderUsers() {
  const users = await api("/admin/api/users");
  $("#view").innerHTML = `${head("users_table")}<div class="panel scroll" style="padding:0"><table class="rows">
    <tr>${["user", "created", "conversations", "turns", "last_seen", "alpha", "reading_speed"].map((k) => `<th>${term(k)}</th>`).join("")}</tr>
    ${users.map((u) => `<tr data-user="${u.id}" class="mono"><td>u${u.id}</td><td>${datetime(u.created_at)}</td><td>${u.conversations}</td><td>${u.turns}</td>
      <td>${datetime(u.last_seen)}</td><td>${pct(u.length_ratio)}</td><td>${u.reading_wps ? esc(ui("wps", { n: num(u.reading_wps, 1) })) : "—"}</td></tr>`).join("")}
  </table></div><div id="user-detail" style="margin-top:16px"></div>`;
  for (const row of document.querySelectorAll("[data-user]")) row.addEventListener("click", () => renderUser(Number(row.dataset.user)));
}

async function renderUser(id) {
  const d = await api(`/admin/api/users/${id}`);
  const lo = Math.log(0.1), hi = Math.log(2);
  const x = (r) => (100 * (Math.log(r) - lo)) / (hi - lo);
  $("#user-detail").innerHTML = `<div class="grid panels">
    <div class="panel scroll">${head("user_lengths")}<table>
      <tr><th>${term("scope")}</th><th>${term("share")}</th><th class="faint" style="white-space:normal">${esc(ui("scale"))}</th></tr>
      ${d.lengths.map((t) => `<tr><td>${esc(scopeName(t.scope))}</td><td class="mono">${pct(t.ratio)} <span class="faint">${factor(t.sd)}</span></td>
        <td><div class="ratio"><div class="band" style="left:${x(t.ratio * Math.exp(-t.sd))}%;width:${x(t.ratio * Math.exp(t.sd)) - x(t.ratio * Math.exp(-t.sd))}%"></div><div class="dot" style="left:${x(t.ratio)}%"></div></div></td></tr>`).join("") || empty("no_finalized", 3)}
    </table></div>
    <div class="panel">${head("user_reading")}${kv([[term("reading_speed"), `${esc(ui("wps", { n: num(d.reading.wps, 1) }))} <span class="faint">${factor(d.reading.rho_sd)}</span>`]])}
      ${caption("reading_shares")}${probBars(d.reading.mixture, READING_COLORS, "reading")}
      <div style="margin-top:16px">${head("reaction_prior")}</div>${probBars(d.reading.reaction_prior)}</div>
    <div class="panel scroll wide">${head("preferences")}${table(["scope", "dimension", "means", "evidence"],
      d.preferences.map((p) => `<tr><td>${esc(scopeName(p.scope))}</td><td>${esc(preference(p.dimension, "")[0])}</td>
        <td class="mono">${Object.entries(p.means).map(([v, m]) => `${esc(preference(p.dimension, v)[1])} ${pct(m)}`).join(" · ")}</td><td class="mono">${num(p.evidence, 1)}</td></tr>`).join("") || empty("none_yet", 4))}
    </div></div>`;
}

/* ---------- Model ---------- */

// What an annotator reports: an outcome, a reading, "no_click" or "<position>:<outcome>".
function observation(o) {
  const [position, outcome] = o.split(":");
  if (outcome) return ui("click_at", { n: Number(position) + 1, outcome: named("outcomes", outcome) });
  return D.outcomes[o] ?? D.reading[o] ?? ui(o);
}

function heatmap(rows, group = "outcomes") {
  const observed = [...new Set(Object.values(rows).flatMap((r) => Object.keys(r)))];
  return `<div class="scroll"><table class="heat"><tr><th class="faint">${esc(ui("real_reported"))}</th>${observed.map((o) => `<th>${esc(observation(o))}</th>`).join("")}</tr>
    ${Object.entries(rows).map(([y, r]) => `<tr><th>${esc(named(group, y))}</th>${observed.map((o) => {
      const p = r[o] ?? 0;
      return `<td style="background:color-mix(in srgb, var(--accent) ${Math.round(100 * p)}%, transparent)">${p >= 0.005 ? num(p, 2) : ""}</td>`;
    }).join("")}</tr>`).join("")}</table></div>`;
}

async function renderModel() {
  const m = await api("/admin/api/model");
  const h = m.hyper;
  const families = Object.keys(m.confusions.assistant || {});
  const learned = (t) => (m.learned[t] ? chip(ui("learned"), "var(--aqua)") : chip(ui("defaults"), "var(--faint)"));
  $("#view").innerHTML = `
    <div class="panel" style="margin-bottom:16px">${head("nightly")}
      <div style="display:flex;align-items:center;gap:12px"><button class="btn primary" id="nightly">${esc(ui("run_nightly"))}</button><span id="nightly-status" class="muted mono"></span></div></div>
    <div class="grid panels">
      <div class="panel">${head("hyper", {}, learned("hyperparams"))}${kv([
        ...h.prior.flatMap((f) => f.feature === "bias"
          ? [[term("mu0"), esc(ui("of_complete", { p: pct(f.ratio) }))], [term("sigma_alpha"), factor(f.sd)]]
          : [[f.feature === "mobile" ? term("mobile_effect") : term("gamma", { type: m.domains[f.feature] ?? scopeName(f.feature) }),
              `${times(f.ratio)} <span class="faint">${factor(f.sd)}</span>`]]),
        [term("sigma_eta"), factor(h.default_sd)],
        [term("tau"), factor(h.tau)],
        [term("overhead"), secs(h.overhead_s)],
      ])}</div>
      <div class="panel">${head("noise", {}, learned("sensor_noise"))}${kv(Object.entries(m.noise).map(([k, v]) => [term(k), plusMinus(v)]))}
        <div style="margin-top:16px">${head("reading_mixture")}</div>${kv([
          [term("s_r"), plusMinus(m.reading.s_r)],
          [term("mu_away"), secs(Math.exp(m.reading.mu_away))],
          [term("s_away"), factor(m.reading.s_away)],
        ])}</div>
      <div class="panel scroll">${head("classes", {}, learned("family_params"))}${table(["class", "speed", "b", "w", "kappa"],
        Object.entries(m.family).map(([f, v]) => `<tr class="mono"><td>${esc(f)}</td><td>${esc(ui("wps", { n: num(v.speed_wps) }))}</td><td>${factor(v.b)}</td><td>${factor(Math.sqrt(v.w))}</td><td>${pct(Math.exp(v.kappa))}</td></tr>`).join("") || empty("classes_until", 5))}
      </div>
    </div>
    <div class="panel" style="margin-bottom:16px">${head("assistant_confusion", {}, learned("annotator_confusion"))}
      <p><label class="muted">${term("class")} <select id="family" style="margin-left:6px">${families.map((f) => `<option>${esc(f)}</option>`).join("")}</select></label></p><div id="assistant-heat"></div></div>
    <div class="grid panels">
      <div class="panel">${head("button_confusion")}${heatmap(m.confusions.button.all)}</div>
      <div class="panel">${head("reading_confusion")}${heatmap(m.confusions.reading.all)}</div>
      <div class="panel">${head("host_prior", {}, learned("host_family_prior"))}${Object.keys(m.host_prior).length ? heatmap(m.host_prior, "hosts") : `<p class="faint">${esc(ui("host_prior_until"))}</p>`}</div>
    </div>`;
  const showFamily = () => { $("#assistant-heat").innerHTML = heatmap(m.confusions.assistant[$("#family").value]); };
  $("#family").onchange = showFamily;
  showFamily();
  $("#nightly").onclick = async () => {
    $("#nightly-status").textContent = ui("running");
    try {
      const r = await api("/admin/api/nightly", { method: "POST" });
      $("#nightly-status").textContent = ui("done", { n: r.replayed_turns });
      setTimeout(renderModel, 800);
    } catch (e) { $("#nightly-status").textContent = ui("failed", { error: e.message }); }
  };
}

/* ---------- Metrics ---------- */

async function renderMetrics() {
  const m = await api("/metrics");
  const ci = (v, format) => (v ? ` <span class="faint">[${format(v[0])} ; ${format(v[1])}]</span>` : "");
  const figure = (s, key, format) => format(s[key]) + ci(s[`${key}_ci95`], format);
  const summary = (s) => kv([
    [term("turns"), num(s.turns)],
    [term("words_per_step"), figure(s, "words_per_step_forward", (v) => num(v, 1))],
    [term("repair_rate"), figure(s, "repair_rate", pct)],
    [term("missing_info_rate"), figure(s, "missing_info_rate", pct)],
    [term("tool_words"), figure(s, "tool_words_per_turn", (v) => num(v, 1))],
  ]);
  const coverage = m.tool_coverage;
  $("#view").innerHTML = `
    <div class="grid panels">
      ${Object.entries(m.by_group || {}).map(([g, s]) => `<div class="panel">${head("by_group", { group: named("groups", g) }, chip(ui(s.label), "var(--warn)"))}${summary(s)}</div>`).join("")}
      ${Object.entries(m.measured || {}).map(([arm, r]) => `<div class="panel">${head("saving", { arm: named("groups", arm) }, chip(ui("measured"), "var(--aqua)"))}${r ? kv([
        [term("saving_row"), pct(r.words_per_step_saving)],
        [term("ci95"), r.ci95 ? `${pct(r.ci95[0])} … ${pct(r.ci95[1])}` : "—"],
      ]) : `<p class="faint">${esc(ui("needs_clusters"))}</p>`}</div>`).join("")}
      <div class="panel">${head("tool_coverage")}${kv([
        [term("turns"), num(coverage.turns)],
        ...["widget_share", "widget_turns_with_show_reply", "conversation_id_reused"].map((k) => [term(k), pct(coverage[k])]),
      ])}</div>
    </div>
    <div class="grid panels">
      <div class="panel scroll">${head("clicks")}${table(["button", "position", "shown", "clicked", "rate"],
        m.clicks.map((c) => `<tr><td>${esc(buttonName(c.button))}</td><td class="mono">${c.position}</td><td class="mono">${c.shown}</td><td class="mono">${c.clicked}</td><td class="mono">${pct(c.click_rate)}</td></tr>`).join("") || empty("none_yet", 5))}</div>
      <div class="panel scroll">${head("compliance_table")}${table(["class", "hosts", "written_asked"],
        (m.compliance || []).map((c) => `<tr class="mono"><td>${esc(c.family)}</td><td>${esc(c.host)}</td><td>${num(c.median_length_over_requested, 2)}</td></tr>`).join("") || empty("none_yet", 3))}</div>
    </div>
    <details class="panel"><summary class="muted">${term("raw")}</summary><pre style="margin-top:10px">${esc(JSON.stringify(m, null, 2))}</pre></details>`;
}

/* ---------- Shell ---------- */

const VIEWS = { live: renderLive, users: renderUsers, model: renderModel, metrics: renderMetrics };

async function render() {
  if (!token) return askToken(false);
  try {
    await VIEWS[state.view]();
    $("#updated").textContent = ui("updated", { time: new Date().toLocaleTimeString(LANG, { hour12: false }) });
  } catch (e) {
    if (e.message !== "unauthorized") $("#view").innerHTML = `<div class="empty error">${esc(e.message)}</div>`;
  }
}

function setView(view) {
  state.view = view;
  for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-current", b.dataset.view === view ? "page" : "false");
  render();
}

for (const b of document.querySelectorAll("#tabs button")) b.addEventListener("click", () => setView(b.dataset.view));
$("#live").addEventListener("click", () => {
  state.live = !state.live;
  $("#live").setAttribute("aria-pressed", String(state.live));
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeTurn(); });
setInterval(() => {
  const busy = document.activeElement?.closest?.("#filters, .tip") || !$("#tipbox").hidden;
  if (state.live && state.view === "live" && !busy && !document.hidden) render();
}, 5000);
render();
</script>
