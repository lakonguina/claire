<!doctype html>
<html lang="{{ language }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<style>
:root {
  --bg: #fdfcf6; --line: #dfdad1; --ink: #191711; --muted: #716d64; --accent: #bc0fbc;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12010d; --line: #3e042b; --ink: #fdfcf6; --muted: #c29aae; --accent: #e520e9; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 Inter, system-ui, sans-serif; padding: 16px; }
main { max-width: 680px; margin: 32px auto; }
h1 { font-size: 26px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 28px 0 6px; }
p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
<h1>{{ title }}</h1>
<p class="muted">{{ updated }}</p>
{% for section in sections %}
<h2>{{ section.title }}</h2>
<p>{{ section.body }}</p>
{% endfor %}
</main>
</body>
</html>
