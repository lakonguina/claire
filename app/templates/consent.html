<!doctype html>
<html lang="{{ language }}" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ texts.title.format(app=app) }}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-background text-foreground font-sans antialiased">

<header class="border-b bg-background/85 backdrop-blur">
  <nav class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3.5 sm:px-6">
    <a href="/" class="flex items-center gap-2 text-base font-semibold tracking-tight">
      <span class="size-3 rounded-[4px] bg-primary"></span>Claire
    </a>
  </nav>
</header>

<main class="mx-auto flex min-h-[calc(100vh-4rem)] max-w-lg flex-col justify-center px-5 py-12 sm:px-6">
  <p class="badge mb-6 w-fit" data-variant="secondary">{{ texts.badge }}</p>
  <h1 class="text-balance text-3xl font-black tracking-tight sm:text-4xl">
    {{ texts.title.format(app=app) }}
  </h1>
  <p class="prose-ui mt-5 text-pretty text-foreground/85">{{ texts.intro }}</p>
  <p class="mt-3 text-[0.95rem] text-muted-foreground">{{ texts.anonymous }}</p>

  <form method="post" class="mt-10 space-y-6" id="consent-form">
    <input type="hidden" name="request" value="{{ request }}">

    <label class="flex cursor-pointer items-start gap-3 rounded-xl border bg-card/60 p-4">
      <input
        type="checkbox"
        name="accept"
        value="1"
        required
        class="mt-1 size-4 shrink-0 rounded border-input accent-[var(--primary)]"
        id="accept"
      >
      <span class="text-[0.95rem] leading-snug text-foreground/90">
        {{ texts.accept_html|safe }}
      </span>
    </label>

    <p class="text-sm text-muted-foreground">{{ texts.storage }}</p>

    <div class="flex flex-col-reverse gap-3 sm:flex-row">
      <button
        type="submit"
        name="action"
        value="deny"
        class="btn flex-1 capitalize"
        data-variant="secondary"
        formnovalidate
      >{{ texts.deny }}</button>
      <button
        type="submit"
        name="action"
        value="{{ allow }}"
        class="btn flex-1 capitalize shadow-lg shadow-primary/30"
        id="allow-btn"
        disabled
      >{{ texts.allow }}</button>
    </div>
  </form>
</main>

<script>
  const box = document.getElementById("accept");
  const allow = document.getElementById("allow-btn");
  const sync = () => { allow.disabled = !box.checked; };
  box.addEventListener("change", sync);
  sync();

  // A consent request works once; ignore a second click or a resubmit.
  let sent = false;
  document.getElementById("consent-form").addEventListener("submit", (event) => {
    if (sent) event.preventDefault();
    sent = true;
  });
</script>
</body>
</html>
