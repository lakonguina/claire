<!doctype html>
<html lang="{{ language }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ texts.title.format(app=app) }}</title>
<style>
:root {
  --bg: #fdfcf6; --panel: #f4f2e8; --line: #dfdad1; --ink: #191711; --muted: #716d64;
  --accent: #bc0fbc;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12010d; --panel: #1d0214; --line: #3e042b; --ink: #fdfcf6; --muted: #c29aae;
    --accent: #e520e9; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font: 15px/1.5 Inter, system-ui, sans-serif; padding: 16px; }
main { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
h1 { font-size: 20px; margin: 0 0 14px; }
h1::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
  background: var(--accent); margin-right: 10px; vertical-align: middle; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); font-size: 14px; }
form { display: flex; gap: 10px; margin-top: 22px; }
button { flex: 1; font: inherit; border-radius: 8px; padding: 10px 14px; cursor: pointer; border: 1px solid var(--line);
  background: none; color: inherit; }
button[value="{{ allow }}"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
</style>
</head>
<body>
<main>
<h1>{{ texts.title.format(app=app) }}</h1>
<p>{{ texts.intro }}</p>
<p class="muted">{{ texts.anonymous }}</p>
<p class="muted">{{ texts.privacy }}</p>
<form method="post">
  <input type="hidden" name="request" value="{{ request }}">
  <button name="action" value="deny">{{ texts.deny }}</button>
  <button name="action" value="{{ allow }}" autofocus>{{ texts.allow }}</button>
</form>
</main>
</body>
</html>
