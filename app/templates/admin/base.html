<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin{% endblock %} · Claire</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-background text-foreground font-sans antialiased">

<header class="border-b bg-background/85 backdrop-blur">
  <nav class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3.5 sm:px-6">
    <div class="flex items-center gap-4">
      <a href="/admin" class="flex items-center gap-2 text-base font-semibold tracking-tight">
        <span class="size-3 rounded-[4px] bg-primary"></span>Claire admin
      </a>
      {% block crumb %}{% endblock %}
    </div>
    {% if request.url.path != "/admin/login" %}
    <form method="post" action="/admin/logout">
      <button type="submit" class="btn capitalize" data-size="sm" data-variant="secondary">Log out</button>
    </form>
    {% endif %}
  </nav>
</header>

<main class="mx-auto max-w-6xl px-4 py-10 sm:px-6">
  {% block body %}{% endblock %}
</main>
</body>
</html>
