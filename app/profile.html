<!doctype html>
<html lang="{{ language }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ texts.title }}</title>
<style>
:root {
  --bg: #fdfcf6; --panel: #f4f2e8; --line: #dfdad1; --ink: #191711; --muted: #716d64;
  --accent: #bc0fbc;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12010d; --panel: #1d0214; --line: #3e042b; --ink: #fdfcf6; --muted: #c29aae;
    --accent: #e520e9; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
h1 { font-size: 22px; margin: 0 0 6px; }
h1::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
  background: var(--accent); margin-right: 10px; vertical-align: middle; }
p { color: var(--muted); margin: 0 0 24px; }
form { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
  padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  margin-bottom: 8px; }
label { min-width: 0; }
label small { display: block; color: var(--muted); }
select, button { font: inherit; color: inherit; border-radius: 6px; padding: 6px 10px; }
select { background: var(--bg); border: 1px solid var(--line); }
button { background: var(--accent); color: #fff; border: 0; cursor: pointer; }
@media (max-width: 520px) { form { grid-template-columns: 1fr auto; } form label { grid-column: 1 / -1; } }
</style>
</head>
<body>
<main>
<h1>{{ texts.title }}</h1>
<p>{{ texts.intro }}</p>
{% for row in rows %}
<form method="post">
  <label>{{ row.name }}<small>{{ row.scope }}</small></label>
  <input type="hidden" name="scope" value="{{ row.scope_id }}">
  <input type="hidden" name="dimension" value="{{ row.dimension }}">
  <select name="value" aria-label="{{ row.name }}">
    {% for value, label in row.options.items() %}
    <option value="{{ value }}"{% if value == row.current %} selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
  <button>{{ texts.save }}</button>
</form>
{% else %}
<p>{{ texts.nothing }}</p>
{% endfor %}
</main>
</body>
</html>
