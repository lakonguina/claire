[project]
name = "claire-pm"
version = "0.1.0"
description = "FastAPI + MCP (Streamable HTTP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.161.0",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.0.0",
    "mcp[cli]>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
