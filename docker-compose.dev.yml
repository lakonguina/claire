# Development: code, templates and catalogs reload live, no restart.
# Loaded by a plain `docker compose up` when .env sets
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
# Production's .env leaves it out, so it runs the image as built.
services:
  app:
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --no-access-log
      - --reload
      - --reload-dir=app
      - --reload-dir=locales
      - --reload-include=*.html
      - --reload-include=*.json
    # The working tree itself: app/static/index.html is the local widget
    # build (README, Develop), app/static/site the site service's output.
    volumes:
      - ./app:/srv/app
      - ./locales:/srv/locales

  # Recompiles the landing stylesheet whenever the template uses new classes.
  site:
    build:
      context: .
      target: site
    command: ["npm", "run", "watch"]
    volumes:
      - ./app:/build/app
      - ./site:/build/site
      # The image's Linux packages, not the host's.
      - /build/site/node_modules
