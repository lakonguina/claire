services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: claire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claire}
      POSTGRES_DB: claire
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "claire"]
      interval: 2s
      retries: 30

  app:
    build: .
    environment: &env
      DATABASE_URL: postgresql://claire:${POSTGRES_PASSWORD:-claire}@db:5432/claire
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      POLICY: ${POLICY:-bayes-v1}
      SHADOW_POLICIES: ${SHADOW_POLICIES:-}
      DATA_KEY: ${DATA_KEY:?set DATA_KEY in .env}
      PRIVACY_EMAIL: ${PRIVACY_EMAIL:-privacy@claire.pm}
      CONTROL_UNIT: ${CONTROL_UNIT:-auto}
      PER_USER_FROM: ${PER_USER_FROM:-100}
      HOLDOUT_SHARE: ${HOLDOUT_SHARE:-0.03}
      CONCISE_SHARE: ${CONCISE_SHARE:-0}
      MESSAGE_SAMPLE: ${MESSAGE_SAMPLE:-0.1}
      MAX_MESSAGE_WORDS: ${MAX_MESSAGE_WORDS:-150}
      GROUND_TRUTH_SHARE: ${GROUND_TRUTH_SHARE:-0.1}
      AMBIGUITY_THRESHOLD: ${AMBIGUITY_THRESHOLD:-0.5}
      RETENTION_DAYS: ${RETENTION_DAYS:-1095}
      ABLATION_SHARE: ${ABLATION_SHARE:-0.1}
      TOKEN_BUDGET: ${TOKEN_BUDGET:-60}
      CANDIDATE_SHARE: ${CANDIDATE_SHARE:-0}
      EVAL_MODELS: ${EVAL_MODELS:-anthropic:claude-sonnet-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      HOST_UI_OVERRIDE: ${HOST_UI_OVERRIDE:-{}}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-3600000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  nightly:
    build: .
    environment: *env
    command: ["sh", "-c", "while true; do sleep 86400; python -m app.jobs.nightly; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
