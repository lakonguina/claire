<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claire</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 12px 14px 16px;
    font: 15px/1.55 ui-sans-serif, system-ui, sans-serif;
    background: transparent;
  }
  #reply { overflow-wrap: anywhere; }
  #reply:empty::before { content: "…"; opacity: 0.45; }
  #reply > :first-child { margin-top: 0; }
  #reply > :last-child { margin-bottom: 0; }
  pre {
    overflow-x: auto;
    padding: 12px;
    border-radius: 8px;
    background: rgba(127, 127, 127, 0.12);
  }
  code { font-family: ui-monospace, monospace; font-size: 14px; }
  table { display: block; overflow-x: auto; border-collapse: collapse; }
  th, td { padding: 4px 10px; border: 1px solid rgba(127, 127, 127, 0.3); }
  .err { color: tomato; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
  <div id="reply"></div>
  <div id="err" class="err" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
